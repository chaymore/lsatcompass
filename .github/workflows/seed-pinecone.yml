name: Seed Pinecone

# Uploads data/resources.json into the Pinecone index (creating the index the first time).
# Runs on demand from the Actions tab, and whenever the resource library changes on main.
# Needs repository secret: PINECONE_API_KEY.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'data/resources.json'
      - 'scripts/seed-pinecone.ts'
      - '.github/workflows/seed-pinecone.yml'

permissions:
  contents: read

concurrency:
  group: seed-pinecone
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Seed
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
        run: npm run seed
